<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200" role="img" aria-labelledby="title desc">
  <title id="title">Productive time</title>
  <desc id="desc">Paneendra Kumar's verified 2026 public commit activity by time of day in Asia Kolkata time.</desc>
  <style>
    .title { fill: #58a6ff; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #8b949e; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #c9d1d9; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <rect x="0.5" y="0.5" width="359" height="199" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" class="title">Productive Time</text>
  <text x="336" y="33" text-anchor="end" class="label">Asia/Kolkata</text>

  <text x="24" y="70" class="label">Morning</text>
  <rect x="102" y="58" width="170" height="14" rx="3" fill="#21262d"/>
  <rect x="102" y="58" width="21" height="14" rx="3" fill="#58a6ff"/>
  <text x="336" y="70" text-anchor="end" class="value">47 · 12.30%</text>

  <text x="24" y="102" class="label">Daytime</text>
  <rect x="102" y="90" width="170" height="14" rx="3" fill="#21262d"/>
  <rect x="102" y="90" width="80" height="14" rx="3" fill="#58a6ff"/>
  <text x="336" y="102" text-anchor="end" class="value">180 · 47.12%</text>

  <text x="24" y="134" class="label">Evening</text>
  <rect x="102" y="122" width="170" height="14" rx="3" fill="#21262d"/>
  <rect x="102" y="122" width="69" height="14" rx="3" fill="#58a6ff"/>
  <text x="336" y="134" text-anchor="end" class="value">155 · 40.58%</text>

  <text x="24" y="166" class="label">Night</text>
  <rect x="102" y="154" width="170" height="14" rx="3" fill="#21262d"/>
  <text x="336" y="166" text-anchor="end" class="value">0 · 0.00%</text>

  <text x="24" y="188" class="label">382 attributed public commits · verified 26 Jul 2026</text>
</svg>
