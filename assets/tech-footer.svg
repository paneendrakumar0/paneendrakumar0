<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Animated engineering technology footer</title>
  <desc id="desc">Layered neon waves, moving circuit signals, and floating technology nodes.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#67e8f9" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="signalPathA" d="M35 62H235L270 92H470L505 55H690L730 86H925L965 48H1165"/>
    <path id="signalPathB" d="M70 125H260L300 105H520L558 132H775L815 102H1100"/>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#panel)"/>
  <rect width="1200" height="220" rx="18" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="32 0" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <use href="#signalPathA" stroke-dasharray="7 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#signalPathB" stroke="#8b5cf6" stroke-dasharray="3 9">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#glow)">
    <circle r="5" fill="#67e8f9">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#signalPathA"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#a78bfa">
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite">
        <mpath href="#signalPathB"/>
      </animateMotion>
    </circle>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="1.4" filter="url(#glow)">
    <g transform="translate(130 88)">
      <path d="M0-13 11-6.5V6.5L0 13-11 6.5V-6.5Z"/>
      <circle r="3" fill="#67e8f9" stroke="none"/>
      <animateTransform attributeName="transform" type="translate" values="130 88;130 80;130 88" dur="3.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1055 91)" stroke="#a78bfa">
      <path d="M0-15 13-7.5V7.5L0 15-13 7.5V-7.5Z"/>
      <circle r="3.5" fill="#a78bfa" stroke="none"/>
      <animateTransform attributeName="transform" type="translate" values="1055 91;1055 101;1055 91" dur="4.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(930 124)" stroke="#22d3ee" opacity="0.75">
      <circle r="11"/>
      <path d="M-16 0H16M0-16V16"/>
      <animateTransform attributeName="transform" type="rotate" from="0 930 124" to="360 930 124" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="Consolas, Monaco, monospace" filter="url(#glow)">
    <text x="600" y="69" fill="#e0f2fe" font-size="20" font-weight="700" letter-spacing="5">ENGINEER • BUILD • ITERATE
      <animate attributeName="opacity" values="0.72;1;0.72" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="94" fill="#67e8f9" font-size="10" letter-spacing="3" opacity="0.8">MECHANICS × ELECTRONICS × SOFTWARE</text>
  </g>

  <path fill="url(#waveB)" opacity="0.34" d="M0 156C150 112 278 204 430 165S714 115 862 164s232 35 338-9v65H0Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 156C150 112 278 204 430 165S714 115 862 164s232 35 338-9v65H0Z;M0 168C148 205 287 113 438 157s275 51 420 6 238-48 342 4v53H0Z;M0 156C150 112 278 204 430 165S714 115 862 164s232 35 338-9v65H0Z"/>
  </path>
  <path fill="url(#waveA)" opacity="0.72" d="M0 181C132 135 252 219 394 180s259-51 405 3 273 30 401-15v52H0Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 181C132 135 252 219 394 180s259-51 405 3 273 30 401-15v52H0Z;M0 190C135 218 261 146 400 177s256 55 401 7 272-37 399 7v29H0Z;M0 181C132 135 252 219 394 180s259-51 405 3 273 30 401-15v52H0Z"/>
  </path>

  <g fill="url(#pulse)" opacity="0.9">
    <circle cx="235" cy="166" r="12">
      <animate attributeName="r" values="5;14;5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="815" cy="174" r="10">
      <animate attributeName="r" values="4;13;4" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
