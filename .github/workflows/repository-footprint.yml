name: Update Repository Footprint

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-footprint.yml"
      - ".github/scripts/update_repository_footprint.py"

permissions:
  contents: write

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Calculate repository storage and source lines
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_repository_footprint.py
      - name: Commit updated footprint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Repository footprint is already current."
          else
            git commit -m "Update repository footprint"
            git pull --rebase origin main
            git push
          fi
